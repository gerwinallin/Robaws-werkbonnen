name: ROBAWS → Google Sheets

on:
  schedule:
    - cron: "0 20 * * *"   # Elke dag om 22:00 NL tijd
  workflow_dispatch: {}     # Handmatig starten via Actions-tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials file
        run: |
          echo "$GCP_SA_KEY" > credentials.json
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run sync script
        env:
          ROBAWS_API_KEY: ${{ secrets.ROBAWS_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: "Blad1"
          GOOGLE_APPLICATION_CREDENTIALS: "credentials.json"
        run: |
          python main.py
